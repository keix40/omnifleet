# Render Blueprint — free-tier API (single web service, Singapore).
# Dashboard: deploy web/dashboard separately on Vercel (see README).
services:
  - type: web
    name: omnifleet-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: OMNIFLEET_SHARED_NATS
        value: "1"
      - key: NATS_EMBEDDED
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://omnifleet-dashboard.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DATABASE_URL
        sync: false
      # Optional: set NATS_EMBEDDED=0 and provide external NATS (e.g. Synadia Cloud).
      - key: NATS_URL
        sync: false
      - key: NATS_CREDS
        sync: false
      - key: NATS_TLS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: omnifleet
      - key: JWT_AUDIENCE
        value: omnifleet-api
      - key: STRIPE_PROVIDER
        value: fake
