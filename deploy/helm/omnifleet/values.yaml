global:
  imageRegistry: ghcr.io/keix40/omnifleet
  jwtSecretRef: omnifleet-jwt

gateway:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

auth:
  enabled: true
  replicaCount: 2
  pdb:
    minAvailable: 1

tracking:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20

geofencing:
  enabled: true
  replicaCount: 2
