{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-env
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  NATS_URL: {{ .Values.secrets.natsUrl | default "nats://nats:4222" | quote }}
  AUTH_GRPC_ADDR: {{ .Values.secrets.authGrpcAddr | default "auth:50051" | quote }}
  TRACKING_GRPC_ADDR: {{ .Values.secrets.trackingGrpcAddr | default "tracking:50052" | quote }}
{{- end }}
