services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: omnifleet
      POSTGRES_PASSWORD: omnifleet
      POSTGRES_DB: omnifleet
      OMNIFLEET_APP_PASSWORD: omnifleet_app
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/seed:/docker-entrypoint-initdb.d/seed:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U omnifleet -d omnifleet && psql -U omnifleet -d omnifleet -tAc \"SELECT count(*) FROM users\" | grep -qE '^[1-9]'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  auth:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: auth
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      OMNIFLEET_DEV_MODE: "1"
      AUTH_GRPC_ADDR: ":50051"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"

  tracking:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: tracking
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      NATS_URL: nats://nats:4222
      TRACKING_GRPC_ADDR: ":50052"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "50052:50052"

  geofencing:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: geofencing
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      NATS_URL: nats://nats:4222
      GEOFENCING_GRPC_ADDR: ":50053"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "50053:50053"

  eta:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: eta
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      NATS_URL: nats://nats:4222
      ETA_GRPC_ADDR: ":50054"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "50054:50054"

  dispatch:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: dispatch
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      NATS_URL: nats://nats:4222
      DISPATCH_GRPC_ADDR: ":50055"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "50055:50055"

  billing:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: billing
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      BILLING_GRPC_ADDR: ":50056"
      STRIPE_PROVIDER: fake
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50056:50056"

  notifications:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: notifications
    environment:
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      NATS_URL: nats://nats:4222
      NOTIFICATIONS_GRPC_ADDR: ":50057"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "50057:50057"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      args:
        SERVICE: gateway
    environment:
      GATEWAY_HTTP_ADDR: "0.0.0.0:8080"
      AUTH_GRPC_ADDR: auth:50051
      TRACKING_GRPC_ADDR: tracking:50052
      ETA_GRPC_ADDR: eta:50054
      DISPATCH_GRPC_ADDR: dispatch:50055
      BILLING_GRPC_ADDR: billing:50056
      NOTIFICATIONS_GRPC_ADDR: notifications:50057
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://omnifleet_app:omnifleet_app@postgres:5432/omnifleet?sslmode=disable
      OMNIFLEET_DEV_MODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      tracking:
        condition: service_started
      eta:
        condition: service_started
      dispatch:
        condition: service_started
      billing:
        condition: service_started
      notifications:
        condition: service_started
      nats:
        condition: service_started
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./web/dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    depends_on:
      - gateway
    ports:
      - "3000:3000"

  gps-simulator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.simulator
    environment:
      GATEWAY_URL: http://gateway:8080
      DRIVER_EMAIL: driver@acme.test
      DRIVER_PASSWORD: demo-password-change-me
      TENANT_SLUG: acme-logistics
      VEHICLE_ID: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
    depends_on:
      - gateway
