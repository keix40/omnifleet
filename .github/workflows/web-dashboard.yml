name: Web Dashboard

on:
  pull_request:
    paths:
      - "web/dashboard/**"
      - ".github/workflows/web-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "web/dashboard/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/dashboard/package.json
      - run: npm install
        working-directory: web/dashboard
      - run: npm run build
        working-directory: web/dashboard
