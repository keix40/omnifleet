name: Mobile Driver

on:
  pull_request:
    paths:
      - "mobile/driver/**"
      - ".github/workflows/mobile-driver.yml"
  push:
    branches: [main]
    paths:
      - "mobile/driver/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: mobile/driver
      - run: npm test
        working-directory: mobile/driver
      - run: npm run lint
        working-directory: mobile/driver
