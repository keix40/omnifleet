syntax = "proto3";

package auth.v1;

option go_package = "github.com/keix40/omnifleet/gen/go/auth/v1;authv1";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_DISPATCHER = 2;
  ROLE_DRIVER = 3;
  ROLE_CUSTOMER = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string tenant_slug = 3;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  TokenClaims claims = 4;
}

message TokenClaims {
  string user_id = 1;
  string tenant_id = 2;
  Role role = 3;
  string email = 4;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  TokenClaims claims = 2;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
}
